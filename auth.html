<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h2 id="form-title" style="text-align:center; margin-bottom: 20px;">Вход</h2>
        <form id="auth-form">
            <div class="input-group">
                <label><i class="fa-regular fa-user"></i> Логин</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label><i class="fa-solid fa-lock"></i> Пароль</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-main" style="width:100%;" id="submit-auth-btn">Войти</button>
        </form>
        <p style="text-align:center; margin-top: 15px; font-size: 0.9rem;">
            <span id="toggle-text">Нет аккаунта?</span> 
            <a href="#" id="toggle-link" style="color:var(--accent); font-weight:bold;">Зарегистрироваться</a>
        </p>
        <a href="index.html" style="display:block; text-align:center; margin-top:20px; color:#777; text-decoration:none;">← Вернуться в магазин</a>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
